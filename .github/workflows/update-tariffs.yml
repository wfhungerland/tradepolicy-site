name: Zollszenarien aktualisieren

on:
  schedule:
    - cron: "17 5 6 * *"     # 6th of each month, 05:17 UTC
  workflow_dispatch:
    inputs:
      force:
        description: "Neu rechnen, auch wenn die CEPII-Datei unverändert ist"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r update/requirements.txt
      - run: python update/update_us_scenarios.py update/assets site/data/scenarios.json ${{ inputs.force && '--force' || '' }}
      - id: commit
        run: |
          if git diff --quiet site/data/scenarios.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add site/data/scenarios.json
            git commit -m "Zollszenarien: neue CEPII-Zolldaten"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: update
    if: needs.update.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
